name: Frontend CI/CD

on:
  push:
    branches:
      
deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      
name: Checkout código
      uses: actions/checkout@v4

      
name: Configurar AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

      
name: Login a ECR
      uses: aws-actions/amazon-ecr-login@v2

      
name: Build imagen
      run: docker build -t frontend .

      
name: Tag imagen
      run: |
        docker tag frontend:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/mi-app/frontend:v1.0.${{ github.run_number }}

      
name: Push imagen a ECR
      run: |
        docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/mi-app/frontend:v1.0.${{ github.run_number }}